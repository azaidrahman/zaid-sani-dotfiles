# Hooks. Always loaded.

# Zoom indicator on layout/selection changes
set-hook -g after-resize-pane 'run "~/.tmux/scripts/zoom-indicator.sh"'
set-hook -g after-select-pane 'run "~/.tmux/scripts/zoom-indicator.sh"'
set-hook -g after-select-window 'run "~/.tmux/scripts/zoom-indicator.sh"'

# The status bar is a session option, so tmux cannot hide it for one window.
# This hook hides it only while a zen window is on screen. Without the hook,
# every other window in the session would lose its status bar during zen mode.
set-hook -ga after-select-window 'run-shell "~/.tmux/scripts/tmux-zen.sh sync #{window_id}"'

# The zen font size lives in a file that Ghostty includes, so it outlives the
# tmux server. If the server stopped during zen mode, drop the override now.
# The script checks first and keeps the override if a window is still in zen
# mode, so a config reload during zen mode changes nothing.
run-shell -b "~/.tmux/scripts/tmux-zen.sh clean"

# Log bell alerts to file for TV channel, send terminal-notifier
set-hook -g alert-bell 'run-shell "~/.tmux/scripts/log-alert.sh \"#{session_name}\" \"#{window_index}\" \"#{window_name}\" BELL"'

# Clear alerts + terminal-notifier when focusing a pane
set-hook -g pane-focus-in 'run-shell "~/.tmux/scripts/clear-alert.sh #{session_name} #{window_index}"'

# Track window/session focus for prefix+o (last active anything)
set-hook -ga after-select-window 'run-shell "~/.tmux/scripts/track-focus.sh #{session_name}:#{window_index}"'
set-hook -g client-session-changed 'run-shell "~/.tmux/scripts/track-focus.sh #{session_name}:#{window_index}"'

# Renumber windows after a window closes (e.g. prefix+x on its last pane),
# same as manual prefix+R. Toggle via @renumber-on-window-kill in options.conf.
set-hook -g window-unlinked 'if -F "#{==:#{@renumber-on-window-kill},on}" "move-window -r" ""'

# Log each window that closes, so prefix+X can show it and open it again. The
# window is gone when the hook runs, so the script reads its panes from the
# last status-line snapshot. See closed-windows.sh.
set-hook -ga window-unlinked 'run-shell -b "~/.tmux/scripts/closed-windows.sh record #{hook_window} #{q:hook_session_name} #{q:hook_window_name}"'

# Put the autosave of tmux-continuum and the snapshot of closed-windows.sh in
# status-right. Keep this line last: the theme writes status-right before it.
run-shell "~/.tmux/scripts/status-jobs.sh"
