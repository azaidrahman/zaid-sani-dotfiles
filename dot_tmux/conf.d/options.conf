# Non-visual tmux options. Always loaded (desktop, mobile, and minimal hosts).

# NOTE: the tmux server's PATH is set authoritatively in plugins.conf, which is
# sourced after this file — do not try to extend PATH here, it gets overwritten.

# Enable 256-color and true color (RGB) support in tmux.
# tmux 3.2+ derives the RGB capability from terminal-features (keyed on the
# OUTER terminal name), not the legacy Tc/RGB entries in terminal-overrides.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks"
# Over SSH the remote host often lacks the xterm-ghostty terminfo, so Ghostty's
# TERM downgrades to xterm-256color and the RGB rule above no longer matches —
# 24-bit colors then collapse to the nearest 256-color gray. Ghostty always sets
# COLORTERM=truecolor, so it's safe to advertise RGB for xterm-256color too.
set -ga terminal-features ",xterm-256color:RGB:hyperlinks"
# hyperlinks: pass OSC 8 links (such as the "PR #<n>" link of Claude Code) to
# the outer terminal, so that they open and copy there, also over SSH.

# General
# Don't auto-rename windows to the foreground command. start-ticket sets the
# window name once at launch; after that a manual rename-window persists.
set -g automatic-rename off
set -g set-clipboard on
set -g mouse on
set -g status-interval 5
set -g detach-on-destroy off
set -g allow-passthrough on

# Window for repeatable (bind -r) keys: Space layout cycling, j/k/h/l resize
set -g repeat-time 650

# Size windows to the most recently active client, not the smallest.
set -g window-size latest

# Size each window from the clients that look at it, not from every client that
# holds the session. A phone attaches with rootshell at about 40 columns. Without
# this option, that client shrinks every window in the session, and the desktop
# client sees the small size too. With this option, the phone shrinks only the
# window it is on. Note that `aggressive-resize` is a window option. It needs
# the `-w` flag, or tmux applies it only to the current window.
set -gw aggressive-resize on

# Status bar position (the bar's *appearance* lives in visual.conf)
set -g status-position bottom

# Monitor bells (Claude Code rings bell on completion)
set -gw monitor-bell on
set -g bell-action any

# vi mode for copy-mode movements
set-window-option -g mode-keys vi

# Extended keys (CSI u) so modified key combos reach apps
set -s extended-keys on
set -s extended-keys-format csi-u

# Feature flags (checked by hooks.conf) — flip here, no need to touch hooks.conf
# Renumber windows after prefix+x kills the last pane in a window (mirrors
# manual prefix+R) so window numbers stay contiguous.
set -g @renumber-on-window-kill "on"
