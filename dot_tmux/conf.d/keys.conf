# Keybindings. Always loaded.

# Set prefix key
unbind C-b
# NOTE: IF ON MAC change C-space at Keyboard -> Input Sources
set -g prefix C-space
bind C-space send-prefix

# Zen mode: font size 24, the pane in the middle, dark gutters, no status bar.
# If the client is not Ghostty, the script does a plain zoom instead. run-shell
# expands the formats, so pass them as arguments: the script cannot read them.
# Use -b. Without it tmux waits for the script and stops serving the command
# queue, so the whole toggle feels slow.
bind-key z run-shell -b "~/.tmux/scripts/tmux-zen.sh '#{pane_id}' '#{client_termname}' '#{window_panes}' '#{client_name}'"

# Zoom pane. This is the plain zoom, and it always works.
bind-key Z resize-pane -Z

# Toggle synchronized panes (broadcast keystrokes to every pane in the window)
bind-key C-y setw synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,ON,OFF}"

# Refresh tmux config with r
unbind r
bind r source-file "~/.tmux.conf"

# Renumber windows sequentially
bind R move-window -r

# Splits in current path
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# Fork the Claude session in the current pane (shift the split key)
bind | run-shell "~/.tmux/scripts/fork-claude-pane.sh '#{pane_id}' '#{pane_current_path}' '#{pane_tty}' h"
bind _ run-shell "~/.tmux/scripts/fork-claude-pane.sh '#{pane_id}' '#{pane_current_path}' '#{pane_tty}' v"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Create a new named session (prompts for name)
bind-key S command-prompt -p "New session:" "new-session -s '%%'"

# My keys summary + full list-keys dump (replaces default ?, loses nothing)
bind-key ? display-popup -E -w 70% -h 80% -T " Keybindings " "~/.tmux/scripts/popups/keys-cheatsheet.sh"

# Move current window into a new (or existing) session
bind-key N command-prompt -p "Send window to session:" "run-shell '~/.tmux/scripts/window-to-session.sh %%'"

# Rename current window (prefilled with current name)
bind-key , command-prompt -I "#W" "rename-window -- '%%'"

# Resurrect
bind C-s run '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-r run '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# Use vim arrows to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z # Use m key to maximize pane

# Use vim arrows to move between panes
bind -r J select-pane -D
bind -r K select-pane -U
bind -r H select-pane -L
bind -r L select-pane -R

# Switch to last active window/session
bind o run-shell "~/.tmux/scripts/switch-last.sh"

# Mark the current session as blocked, or clear the mark. A held session keeps
# its [HOLD] name in the status bar. It leaves the default view of prefix+f
# (press ctrl-s there to see it) and the prefix+[ / prefix+] rotation.
bind-key b run-shell "~/.tmux/scripts/toggle-hold.sh"

# Cycle prev/next through the filtered tmux-windows set (same filter as the
# tmux-windows tv channel / prefix+f), in a stable spatial order.
# Repeatable: hold prefix once, tap [ / ]. The format args expand on each press
# so the script always knows the current window.
bind -r [ run-shell "~/.tmux/scripts/cycle-windows.sh prev '#{session_name}:#{window_index}'"
bind -r ] run-shell "~/.tmux/scripts/cycle-windows.sh next '#{session_name}:#{window_index}'"

# Same cycling without the prefix: ctrl+option+b / ctrl+option+f on macOS
# (Ghostty has macos-option-as-alt = true, so option arrives as Meta).
# ctrl+option+h/l was tried first but clashes with Todoist's global hotkey on
# ctrl+option+l; b/f (back/forward) is free and keeps directional mnemonics.
# Plain ctrl+b/f is NOT an option here: those are readline/vim/less page
# and char-movement keys, and -n binds at the root table before the pane
# ever sees them, so it would break paging everywhere.
# Cycle windows back (no prefix)
bind -n C-M-b run-shell "~/.tmux/scripts/cycle-windows.sh prev '#{session_name}:#{window_index}'"
# Cycle windows forward (no prefix)
bind -n C-M-f run-shell "~/.tmux/scripts/cycle-windows.sh next '#{session_name}:#{window_index}'"

# Restore tmux defaults: swap current pane with prev/next
bind "{" swap-pane -U
bind "}" swap-pane -D

# Cycle pane layouts (repeatable: hold prefix once, tap Space)
bind -r Space next-layout

# Television: fuzzy tmux window picker (sorted by recent activity)
# Size shared with F/a via tv-popup-size.sh
bind-key "f" run-shell "~/.tmux/scripts/popups/tv-popup.sh Windows '#{pane_current_path}' tv"

# Television: general channel browser (scroll through every channel)
bind-key "F" run-shell "~/.tmux/scripts/popups/tv-popup.sh Television '#{pane_current_path}' 'tv channels'"

# Television: windows needing attention (bells from Claude, activity)
bind-key "a" run-shell "~/.tmux/scripts/popups/tv-popup.sh Alerts '#{pane_current_path}' 'tv tmux-alerts'"

# Neogit popup in current pane's directory (t — replaces default clock-mode; g is tmux-jump)
# Size shared with Lazygit (T) and the tuicr-review popup (e) via git-popup-size.sh
unbind t
bind-key "t" run-shell "~/.tmux/scripts/popups/git-popup.sh Neogit '#{pane_current_path}' 'NVIM_APPNAME=nvim-neogit nvim'"

# Lazygit popup in current pane's directory (T)
bind-key "T" run-shell "~/.tmux/scripts/popups/git-popup.sh Lazygit '#{pane_current_path}' lazygit"

# Claude usage report popup (lowercase u is free; U is tpm plugin update)
# Routed through --popup so the script can size the popup itself (the quota,
# cost and combined views each need different space, see size_for() in
# claude-usage.sh) instead of a blind 80%/50% of the terminal. run-shell
# (unlike display-popup) expands formats in its command, so #{pane_id} and
# #{pane_current_path} resolve here.
bind-key "u" run-shell -b '~/.tmux/scripts/claude-usage.sh --popup "#{pane_id}" "#{pane_current_path}"'

# Consolidated cloud/context status popup (gcloud account, kube context, ...)
bind-key G display-popup -E -w 60% -h 40% -T ' Context ' '~/.tmux/scripts/popups/context-status.sh'

# Orca board popup (C — replaces the default customize-mode)
# Size lives in orca-popup-size.sh. Enter on a row jumps to the task window
# behind the popup; press q to close the popup and see it.
bind-key "C" run-shell "~/.tmux/scripts/popups/orca-popup.sh '#{pane_current_path}'"

# Copy mode (default [ is repurposed for session switching above)
bind v copy-mode

# Start selecting text with "v"
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy text with "y"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Plain drag: do NOT enter tmux copy-mode — let the running app (Claude, vim, etc.)
# handle the mouse so its own selection/copy works
unbind -n MouseDrag1Pane

# Ctrl+drag: enter tmux copy-mode and begin a mouse selection
bind -n C-MouseDrag1Pane if -F "#{mouse_any_flag}" "send -M" "copy-mode -M"

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# prefix+P — preview the clipboard as markdown in a popup, confirm, then open it
# in nvim with MarkdownPreview auto-fired. Pairs with Claude's /copy command (or
# any copy-mode `y` yank): the clipboard is the hand-off, this is the viewer.
# The opened window is named md:<source window> so you can see where it came from.
# (lowercase p stays as the default previous-window binding.)
bind P run-shell "~/.tmux/scripts/popups/md-preview.sh '#{window_name}' '#{pane_current_path}'"

# prefix+) (shift+0): scan the current pane + scrollback for every .md file path
# it mentions; one hit opens straight into the markdown viewer, multiple hits
# give an fzf picker (with a bat preview) to scroll and choose. Same viewer as
# prefix+P.
# Pick a .md file mentioned in the pane and preview it
bind-key ) run-shell "~/.tmux/scripts/popups/pane-md-preview.sh '#{pane_id}' '#{window_name}' '#{pane_current_path}'"

# prefix+e — review a git worktree's changes with tuicr. Four-way behaviour,
# decided by the active pane's repo state:
#   not a git repo          -> tmux status message, no popup
#   repo has >1 worktree    -> popup: fzf-pick a worktree (dirty or clean),
#                              then `tuicr -w` there
#   single worktree, dirty  -> popup: `tuicr -w` on the pane's cwd directly
#   single worktree, clean  -> tmux status message, no popup
# The worktree picker lists git worktrees only — it never browses directories
# and was never zoxide; that was removed on purpose. -w skips tuicr's commit
# selector and reviews uncommitted changes directly. Comments persist to the
# session store, so they survive quitting and Claude can read them back with
# `tuicr review comments`.
# Delegated to a wrapper script so tmux expands the format into its args.
bind e run-shell "~/.tmux/scripts/popups/claude-diff-review.sh '#{pane_current_path}' '#{pane_id}'"

# prefix+y — edit the commit message that Claude proposed. Claude writes it to
# .git/CLAUDE_COMMIT_MSG (the git dir of the pane's repo or worktree). The popup
# runs `git commit -v` in nvim with that message filled in, and the staged diff
# below it. :wq commits. :cq aborts and keeps your edits for Claude.
# Edit Claude's proposed commit message
bind y run-shell "~/.tmux/scripts/popups/commit-msg-popup.sh '#{pane_current_path}'"

# prefix+i — send the clipboard screenshot to the other machine (onyx <-> aqua)
# with clipssh, then put the remote /tmp path on the local clipboard. Take the
# screenshot with Cmd+Shift+Ctrl+4 first, then paste the path into Claude or
# nvim on that machine. Set CLIPSSH_HOST in the tmux environment to override
# the target. To send to some other host, run `clipssh <host>` in a shell.
# (Capital I is not free: tpm binds it to install plugins.)
# Send the clipboard screenshot to the other machine
bind i run-shell "~/.tmux/scripts/clipssh-send.sh"
