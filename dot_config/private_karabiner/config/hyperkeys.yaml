# Hyper Navigation (CapsLock held)
# Declarative: generates both EDN rules and help overlay.
#
# Format:
#   key:
#     -: action              # help label (base hyper+key)
#     modifier: action       # help label (+modifier variant)
#
# Modifiers: shift, cmd, opt, ctrl, opt+cmd, ctrl+shift
# Actions: goku key code, or ["seq", "of", "keys"] for sequences
# The # comment after each action becomes the help overlay label.
# Write the comment as "# label | description". The short label (7
# characters or less) shows on the keycap of the key search HUD. The
# description shows in the help overlay and in the key search HUD list.

# !  | means mandatory
# #  | means optional
# C  | left_command
# T  | left_control
# O  | left_option
# S  | left_shift
# F  | fn
# Q  | right_command
# W  | right_control
# E  | right_option
# R  | right_shift
# P  | caps_lock
# !! | mandatory command + control + optional + shift (hyper)
# ## | optional any

# Special key names (use these instead of the symbol):
#   -  → hyphen        =  → equal_sign     [  → open_bracket
#   ]  → close_bracket ;  → semicolon      '  → quote
#   ,  → comma         .  → period         /  → slash
#   \  → backslash     `  → grave_accent_and_tilde
#   space → spacebar
#
# "misc" section: keys handled in CapsLock-to-Hyper (not Hyper Navigation)

hyper:
  h:
    -: left_arrow # ←
    shift: "!TStab" # prevTab
    cmd: "!Sleft_arrow" # sel
    opt: "!Oleft_arrow" # word
    opt+cmd: "!OSleft_arrow" # selWord

  j:
    -: down_arrow # ↓
    shift: "!Ctab" # nextApp
    cmd: "!Sdown_arrow" # sel
    opt+cmd: ["!Sdown_arrow", "!Sdown_arrow", "!Sdown_arrow"] # sel3
    ctrl: "!Tdown_arrow" # expose

  k:
    -: up_arrow # ↑
    shift: "!CStab" # prevApp
    cmd: "!Sup_arrow" # sel
    opt+cmd: ["!Sup_arrow", "!Sup_arrow", "!Sup_arrow"] # sel3

  l:
    -: right_arrow # →
    shift: "!Ttab" # nextTab
    cmd: "!Sright_arrow" # sel
    opt: "!Oright_arrow" # word
    opt+cmd: "!OSright_arrow" # selWord

  # u and p have no plain binding. Use Tab+a and Tab+e (Ctrl) for the start
  # and the end of the line. Only the select keys stay.
  u:
    cmd: "!CSleft_arrow" # selHome | select to the start of the line

  p:
    cmd: "!CSright_arrow" # selEnd | select to the end of the line

  x:
    -: delete_or_backspace # ⌫
    shift: delete_forward # ⌦

  f:
    -: "!Tup_arrow" # mission | mission control

  c:
    -: "!CTOSc" # clip | alfred clipboard

  s:
    -: "!CTOSs" # snippet | alfred snippets

  z:
    -: "!CTOSz" # zuno | alfred zuno search

  -:
    -: "!CTOShyphen" # bmarks | browser bookmarks

  =:
    -: "!CTOSequal_sign" # bTabs | browser tabs

  \:
    -: "!CTOSbackslash" # pins | alfred pinned bookmarks

  e:
    -: "!CTOSe" # windows | alfred open windows

  r:
    -: "!CTOSt" # rexTabs | alfred rex tabs
    shift: "!CTOSr" # repos | alfred bitbucket repos

  i:
    -: "!CTOSi" # mouse | mouseless overlay

  g:
    -: "!CTOSg" # newTask | alfredo new task
    ctrl: "!CSf13" # tasks | alfredo all tasks

  "2":
    -: "!CTOS2" # jira | alfred jira
    shift: "!CTOSp" # PRs | alfred bitbucket prs

  "8":
    -: "!CTOS8" # menus | alfred menu bar search

  m:
    -: "!CTOSm" # ytMusic | alfred youtube music

  "0":
    -: "!QWER0" # ice bar

  q:
    -: "!QWERq" # freekey | mouseless freekey (hold)

  o:
    ctrl: "!CTOSo" # audio | alfred audio out

misc:
  spacebar:
    cmd: "!TCspacebar" # emoji

  escape:
    -: "!Tcaps_lock" # caps

# "ctrl" section: keys that you push while you hold Tab (Tab held = Ctrl).
# These keys make no rule. The shell and most text fields read them as
# readline keys. They show on the last line of the hyper help overlay, and
# in the list of the key search HUD.
ctrl:
  a:
    -: "Tab+a: go to the start of the line" # start
  e:
    -: "Tab+e: go to the end of the line" # end
