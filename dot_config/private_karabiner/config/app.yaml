# App launcher definitions (right_option + key)
# Format: key | label | app name (or !GokuCommand)
#
# Uppercase key = shifted variant (right_option + shift + key)
# Prefix app with ! to use a raw goku command instead of open -a

app:
  - w | WA | Whatsapp
  - W | messages | Messages
  - e | obsidian | Obsidian
  - r | arc(work) | sh:$HOME/.config/karabiner/scripts/arc-space.sh Work
  - R | arc(not work) | sh:$HOME/.config/karabiner/scripts/arc-space.sh Zaid
  - t | ghostty | Ghostty
  - y | sioyek | Sioyek
  - i | IINA | IINA
  - I | ytmusic | Youtube Music
  - j | jira | Jira
  - o | orb | Orbstack
  - p | gchat | sh:$HOME/.config/karabiner/scripts/arc-tab.sh Work GCHAT
  - s | slack | Slack
  - f | cal | Calendar
  - F | alfred | Alfred Preferences
  - g | iPhone | iPhone Mirroring
  - G | safari | Safari
  - h | arc(research) | sh:$HOME/.config/karabiner/scripts/arc-space.sh Research
  - k | KM | Keyboard Maestro
  - l | gmail(gmd) | sh:$HOME/.config/karabiner/scripts/arc-tab.sh Work 'GMAIL GMD'
  - c | switch | !Cgrave_accent_and_tilde
  - v | chrome | Google Chrome
  - b | telegram | Telegram
  - n | ino | Inoreader
  - m | spotify | Spotify
  - x | mixlet | Mixlet
  - d | t3code | sh:$HOME/.config/karabiner/scripts/launch-t3code.sh
