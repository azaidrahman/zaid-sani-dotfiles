# App launcher definitions (right_option + key)
# Format: key | label | app name (or !GokuCommand)
#
# Uppercase key = shifted variant (right_option + shift + key)
# ⇧ before a key that has no uppercase = shifted variant, for example ⇧1
# Prefix app with ! to use a raw goku command instead of open -a

app:
  - w | WA | Whatsapp
  - W | messages | Messages
  - e | obsidian | Obsidian
  - 1 | web(work) | sh:$HOME/.local/bin/browser space Work
  - 2 | web(zaid) | sh:$HOME/.local/bin/browser space Zaid
  - t | ghostty | sh:$HOME/.config/karabiner/scripts/ghostty-window.sh
  - i | IINA | IINA
  - I | ino | Inoreader
  - j | jira | Jira
  - p | gchat | sh:$HOME/.local/bin/browser tab gchat
  - s | slack | Slack
  - f | cal | Calendar
  - F | alfred | Alfred Preferences
  - g | iPhone | iPhone Mirroring
  - G | safari | Safari
  - 3 | web(research) | sh:$HOME/.local/bin/browser space Research
  - 4 | web(youtube) | sh:$HOME/.local/bin/browser space YouTube
  - ⇧1 | win(work) | sh:$HOME/.local/bin/browser space-window Work
  - ⇧2 | win(zaid) | sh:$HOME/.local/bin/browser space-window Zaid
  - ⇧3 | win(research) | sh:$HOME/.local/bin/browser space-window Research
  - ⇧4 | win(youtube) | sh:$HOME/.local/bin/browser space-window YouTube
  - 5 | web(study) | sh:$HOME/.local/bin/browser space Study
  - ⇧5 | win(study) | sh:$HOME/.local/bin/browser space-window Study
  - k | KM | Keyboard Maestro
  - l | gmail | sh:$HOME/.local/bin/browser tab gmail
  - L | gmail(work) | sh:$HOME/.local/bin/browser tab gmail-work
  - \ | switch | !Cgrave_accent_and_tilde
  - v | chrome | Google Chrome
  - b | telegram | Telegram
  - n | todoist | sh:$HOME/.local/bin/browser open --float https://todoistenhanced.julesbertolino.fr https://todoistenhanced.julesbertolino.fr
  - o | todoist(app) | Todoist
  - x | mixlet | Mixlet
  - 0 | claude | Claude
  - r | rex | Rex Beta
  - m | ytm | YouTube Music for Desktop
