# App launcher definitions (right_option + key)
# Format: key | label | app name (or !GokuCommand)
#
# Uppercase key = shifted variant (right_option + shift + key)
# Prefix app with ! to use a raw goku command instead of open -a

app:
  - w | WA | Whatsapp
  - W | messages | Messages
  - e | obsidian | Obsidian
  - 1 | arc(work) | sh:$HOME/.config/karabiner/scripts/arc-space.sh Work
  - 2 | arc(zaid) | sh:$HOME/.config/karabiner/scripts/arc-space.sh Zaid
  - t | ghostty | sh:$HOME/.config/karabiner/scripts/ghostty-window.sh
  - i | IINA | IINA
  - I | ino | Inoreader
  - j | jira | Jira
  - p | gchat | sh:$HOME/.config/karabiner/scripts/arc-tab.sh Work GCHAT
  - s | slack | Slack
  - f | cal | Calendar
  - F | alfred | Alfred Preferences
  - g | iPhone | iPhone Mirroring
  - G | safari | Safari
  - 3 | arc(research) | sh:$HOME/.config/karabiner/scripts/arc-space.sh Research
  - k | KM | Keyboard Maestro
  - l | gmail(gmd) | sh:$HOME/.config/karabiner/scripts/arc-tab.sh Work 'GMAIL GMD'
  - \ | switch | !Cgrave_accent_and_tilde
  - v | chrome | Google Chrome
  - b | telegram | Telegram
  - n | todoist | sh:$HOME/.config/karabiner/scripts/arc-float-tab.sh https://todoistenhanced.julesbertolino.fr
  - x | mixlet | Mixlet
  - 0 | claude | Claude
