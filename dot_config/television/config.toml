# Television (tv) configuration.
#
# Only three channels are in use: tmux-windows (prefix+f), tmux-alerts
# (prefix+a), and channels (prefix+F). The old full configuration, with the
# shell integration, is in archive/television/config.toml.

tick_rate = 50
default_channel = "tmux-windows"
# Search history per channel.
history_size = 200
global_history = false

[ui]
ui_scale = 100
orientation = "landscape"
theme = "default"

[ui.input_bar]
position = "top"
prompt = ">"
border_type = "rounded"

[ui.status_bar]
separator_open = ""
separator_close = ""
hidden = false

[ui.results_panel]
border_type = "rounded"

[ui.preview_panel]
size = 50
scrollbar = true
border_type = "rounded"
hidden = false

[ui.help_panel]
show_categories = true
hidden = true

[ui.remote_control]
show_channel_descriptions = true
sort_alphabetically = true

[ui.theme_overrides]
# Neutral slate selection: a saturated hue here dulls the colored rows in the
# tmux-windows channel (state dots and session names). Grey competes with none.
selection_bg = "#44475a"
selection_fg = "#ffffff"
match_fg = "#fbbf24"

[keybindings]
esc = "quit"
ctrl-c = "quit"

# Navigation and selection
down = "select_next_entry"
ctrl-n = "select_next_entry"
ctrl-j = "select_next_entry"
up = "select_prev_entry"
ctrl-p = "select_prev_entry"
ctrl-k = "select_prev_entry"
ctrl-up = "select_prev_history"
ctrl-down = "select_next_history"
tab = "toggle_selection_down"
backtab = "toggle_selection_up"
enter = "confirm_selection"

# Preview panel
pagedown = "scroll_preview_half_page_down"
pageup = "scroll_preview_half_page_up"
ctrl-f = "cycle_previews"

# Data
ctrl-y = "copy_entry_to_clipboard"
ctrl-r = "reload_source"
# Switch between the groups of tmux-windows: active, hold, other.
ctrl-s = "cycle_sources"

# UI features
ctrl-t = "toggle_remote_control"
ctrl-x = "toggle_action_picker"
ctrl-o = "toggle_preview"
ctrl-h = "toggle_help"
f12 = "toggle_status_bar"
ctrl-l = "toggle_layout"

# Input field
backspace = "delete_prev_char"
ctrl-w = "delete_prev_word"
ctrl-u = "delete_line"
delete = "delete_next_char"
left = "go_to_prev_char"
right = "go_to_next_char"
home = "go_to_input_start"
ctrl-a = "go_to_input_start"
end = "go_to_input_end"
ctrl-e = "go_to_input_end"
