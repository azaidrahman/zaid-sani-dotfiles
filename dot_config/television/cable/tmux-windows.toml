[metadata]
name = "tmux-windows"
description = "List and switch between tmux windows"
requirements = ["tmux"]

[source]
no_sort = true
ansi = true
# Three sources: working windows first, held ones second, utility sessions
# last. ctrl-f cycles between them, so a [HOLD] session and a utility session
# stay reachable without sitting in the default view.
command = [
  "~/.tmux/scripts/tv-tmux-windows.sh active",
  "~/.tmux/scripts/tv-tmux-windows.sh hold",
  "~/.tmux/scripts/tv-tmux-windows.sh other",
]
# tv runs the source again at this interval while the picker is open. Each
# reload can move the list while you type, so do not reload more often.
watch = 1.0
output = "{strip_ansi|split:│:0|split:●:1|trim}:{strip_ansi|split:│:1|trim}"

[keybindings]
enter = "actions:select"
# ctrl-f moves to the next source. tv can only cycle forward. Do not bind a
# key to two cycle_sources: tv then moves the indicator two steps but loads
# the rows of one step, so the indicator and the rows do not agree.
ctrl-f = "cycle_sources"

# Each shell command puts the target between single quotes. tv does not
# escape it, so a `'` in a session name could end the quotes and run text as
# a command. `replace:s/'/?/g` changes each `'` to `?`. tmux treats a target
# that has no exact match as a pattern, so `x?y` still finds the session `x'y`.
[preview]
# Colored legend pinned at the top of the preview, then the live pane capture.
command = "printf '\\033[1;38;2;96;165;250m●\\033[0m busy   \\033[1;38;2;255;85;85m●\\033[0m waiting   \\033[1;38;2;74;222;128m●\\033[0m idle\\n\\n'; tmux capture-pane -t '{strip_ansi|split:│:0|split:●:1|trim|replace:s/'/?/g}:{strip_ansi|split:│:1|trim|replace:s/'/?/g}' -p 2>/dev/null || echo 'No preview available'"

[ui.preview_panel]
# Header shows just the window name (3rd column), no dot or session:idx.
header = "{strip_ansi|split:│:2|trim}"

[actions.select]
description = "Switch to the selected window"
command = "tmux switch-client -t '{strip_ansi|split:│:0|split:●:1|trim|replace:s/'/?/g}:{strip_ansi|split:│:1|trim|replace:s/'/?/g}'"
mode = "execute"

[actions.kill]
description = "Kill the selected window"
command = "tmux kill-window -t '{strip_ansi|split:│:0|split:●:1|trim|replace:s/'/?/g}:{strip_ansi|split:│:1|trim|replace:s/'/?/g}'"
mode = "fork"
