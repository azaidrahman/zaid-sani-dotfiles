[metadata]
name = "tmux-windows"
description = "List and switch between tmux windows"
requirements = ["tmux"]

[source]
no_sort = true
ansi = true
# Three sources: working windows first, held ones second, utility sessions
# last. ctrl-s cycles between them, so a [HOLD] session and a utility session
# stay reachable without sitting in the default view.
command = [
  "~/.tmux/scripts/tv-tmux-windows.sh active",
  "~/.tmux/scripts/tv-tmux-windows.sh hold",
  "~/.tmux/scripts/tv-tmux-windows.sh other",
]
watch = 0.5
output = "{strip_ansi|split:\t:1}"

[keybindings]
enter = "actions:select"

[preview]
# Colored legend pinned at the top of the preview, then the live pane capture.
command = "printf '\\033[1;34m●\\033[0m busy   \\033[1;31m●\\033[0m waiting   \\033[1;32m●\\033[0m idle\\n\\n'; tmux capture-pane -t '{strip_ansi|split:\t:1}' -p 2>/dev/null || echo 'No preview available'"

[ui.preview_panel]
# Header shows just the window name (3rd column), no dot or session:idx.
header = "{strip_ansi|split:\t:2}"

[actions.select]
description = "Switch to the selected window"
command = "tmux switch-client -t '{strip_ansi|split:\t:1}'"
mode = "execute"

[actions.kill]
description = "Kill the selected window"
command = "tmux kill-window -t '{strip_ansi|split:\t:1}'"
mode = "fork"
