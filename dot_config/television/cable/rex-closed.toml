[metadata]
name = "rex-closed"
description = "Rex tabs and sessions that closed, newest first. Enter opens one again"
requirements = ["rex", "jq"]

# Each line is "<id>\t<text>". The id has only letters, digits and dashes, so
# the shell commands below can use it without quotes.
[source]
command = "~/.config/rex/scripts/closed-tabs.sh list"
display = "{split:\t:1}"
output = "{split:\t:0}"
no_sort = true
frecency = false

[preview]
command = "~/.config/rex/scripts/closed-tabs.sh preview {split:\t:0}"

[keybindings]
enter = "actions:reopen"

[actions.reopen]
description = "Open the tab again"
command = "~/.config/rex/scripts/closed-tabs.sh reopen {split:\t:0}"
mode = "execute"
