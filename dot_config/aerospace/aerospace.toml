# [workspace-to-monitor-force-assignment]
# 1 = 2
# 2 = 2 
# 3 = 2 
# 4 = 2
# 5 = 1 
# 6 = 1
# 7 = 1
# 8 = 3 
# 9 = 3 
# 10 = 3   

[workspace-to-monitor-force-assignment]
# 1 is 2nd monitor, 3 is vertical monitor, for some reason idk
1 = [1,'built-in']
2 = [1,'built-in']
3 = [2,'built-in']
4 = [2,'built-in']
5 = [2,1,'built-in']
# 6 = [1,'built-in']
# 7 = [3,2,'built-in']
# 8 = [3,2, 'built-in']
# 9 = [3,2, 'built-in']
# 10 = [3,2,'built-in']

[gaps]
inner.horizontal = 4
inner.vertical =   4
outer.left =       4
outer.bottom =     4
outer.top =        4
outer.right =      4

# Keybindings moved to Karabiner (see karabiner.base.edn / help-text.yaml)
[mode.main.binding]


# Floating
[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'
[[on-window-detected]]
if.app-name-regex-substring = 'FreeTube'
run = 'layout floating'  
[[on-window-detected]]
if.app-name-regex-substring = '1Password'
run = 'layout floating'
[[on-window-detected]]
if.app-name-regex-substring = 'Todoist'
run = [
    # 'move-node-to-workspace 9',
    'layout floating',
]
[[on-window-detected]]
if.app-id = 'ch.protonvpn.mac'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.clock'
run = 'layout floating'

# Workspace 1 - Terminal/Apps
# Workspace 2 - Work Browser/Work Apps
# Workspace 3 - Personal Browser/Secondary Browser
# Workspace 4 - Secondary Apps
# Workspace 5 - Main aka Blank (Place to do splits)

# Browser
[[on-window-detected]]
if.app-name-regex-substring = 'Vivaldi'
run = 'move-node-to-workspace 1'
[[on-window-detected]]
if.app-name-regex-substring = 'Arc'
run = 'move-node-to-workspace 1'

# Apps
[[on-window-detected]]
if.app-name-regex-substring = 'Docker'
run = 'move-node-to-workspace 4'

#News
[[on-window-detected]]
if.app-name-regex-substring = 'Inoreader'
run = 'move-node-to-workspace 2'
[[on-window-detected]]
if.app-name-regex-substring = 'IINA'
run = 'move-node-to-workspace 4'
# run = 'layout floating'  

# Terminal
[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = [
  "layout floating",
  "move-node-to-workspace 1",
]

# Note
[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian'
run = 'move-node-to-workspace 1'
[[on-window-detected]]
if.app-id = 'info.sioyek.sioyek'
run = 'move-node-to-workspace 1'

# AI
# [[on-window-detected]]
# if.app-name-regex-substring = 'T3 Chat'
# run = 'move-node-to-workspace 8'
[[on-window-detected]]
if.app-name-regex-substring = 'Claude'
run = 'move-node-to-workspace 2'

# Emails & Tasks
[[on-window-detected]]
if.app-name-regex-substring = 'Fantastical'
run = 'move-node-to-workspace 2'
[[on-window-detected]]
if.app-name-regex-substring = 'Outlook'
run = 'move-node-to-workspace 2'

# Chats
[[on-window-detected]]
if.app-name-regex-substring = 'Messages'
run = 'move-node-to-workspace 4'
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 2'
[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
run = 'move-node-to-workspace 2'
[[on-window-detected]]
if.app-name-regex-substring = 'Telegram'
run = 'move-node-to-workspace 4'
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 1'

# [[on-window-detected]]
#   if.app-id = 'com.github.th-ch.youtube-music'
#   run = 'move-node-to-workspace 5'

