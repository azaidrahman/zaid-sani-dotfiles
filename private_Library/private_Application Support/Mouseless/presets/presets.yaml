app_version: 1.1.0-preview.1
classname: PresetColl
name: ''
preset_data:
  grid_configs:
    zaid:
    - always_show_subgrid: false
      grid_defn:
      - border_width: 0
        callback: build_cell_strings
        keys: QWERT ASDFG ZXCVB YUIOP HJKL; NM,./
        num_cells_x: 5
        num_cells_y: 6
      - border_width: 1
        callback: build_cell_strings
        keys: QWERT ASDFG ZXCVB YUIOP HJKL; NM,./
        num_cells_x: 5
        num_cells_y: 6
      - border_width: 0
        callback: apply_strings_and_subgrid_to_cells
        keys: ''
        num_cells_x: 2
        num_cells_y: 1
      hold_subgrid_key_for_nudge: false
      name: position_based
      nudges_per_cell: 8
      strategy: subgrid
      subgrid_cols: 8
      subgrid_mouse_action_keys: QWER UIOP ASDF JKL; ZXCV M,./
      subgrid_rows: 3
